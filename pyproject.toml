[project]
name = "vrs-sandbox"
version = "0.1.0"
description = "RealSense ROS bag data extraction tool"
readme = "README.md"
requires-python = ">=3.10.6"
dependencies = [
    "pyrealsense2>=2.58.2.10647",
    "rosbags>=0.11.3",
    "numpy>=1.24.0,<2.3",
    "opencv-python>=5.0.0.93",
    "vrs>=1.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=scripts --cov-report=term-missing"
markers = [
    "integration: requires a real RealSense ROSbag file",
    "e2e: generates a synthetic ROSbag and converts it using the official VRS implementation",
    "slow: long-running conversion checks",
]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
no_site_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = [
    "numpy",
    "pyvrs",
    "pyvrs.*",
    "rosbags.*",
    "vrsbindings",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "mypy>=2.2.0",
    "ruff>=0.15.20",
]
